[project]
name = "pdf-anonymizer"
version = "0.1.0"
description = "Anonymize sensitive fields in HISCON PDF documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
pdf-anonymizer = "pdf_anonymizer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
